# Contract for deploy health-gate JSON failure demo (exec probe always fails).
version: "1"
project: unhealthy-health-demo

requirements:
  - type: command_exists
    command: podman

services:
  sick:
    image: docker.io/library/alpine:latest
    command: ["sleep", "infinity"]
    health:
      exec:
        command: ["sh", "-c", "exit 1"]
      interval: 1s
      timeout: 1s
      retries: 0
      start_period: 0s
    dependents:
      - client
  client:
    image: docker.io/library/alpine:latest
    command: ["sleep", "infinity"]
    depends_on:
      sick:
        condition: service_healthy

volumes: {}
networks: {}
