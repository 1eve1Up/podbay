name: License compliance

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.md"
      - "cmd/**"
      - "internal/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "tools/licensing/**"
      - "tools/run-license-compliance.sh"
      - ".github/workflows/license-compliance.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.md"
      - "cmd/**"
      - "internal/**"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "tools/licensing/**"
      - "tools/run-license-compliance.sh"
      - ".github/workflows/license-compliance.yml"

permissions:
  contents: read

jobs:
  license:
    name: ScanCode + allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install libarchive for ScanCode extractcode
        run: sudo apt-get update && sudo apt-get install -y libarchive13

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/licensing/requirements.txt

      - name: Install license tooling
        run: pip install -r tools/licensing/requirements.txt

      - name: Policy unit tests, ScanCode scan, and allowlist validation
        run: ./tools/run-license-compliance.sh
