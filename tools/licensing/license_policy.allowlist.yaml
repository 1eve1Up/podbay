# Inbound license policy for ScanCode-generated SPDX expressions (third-party material).
# Podbay is Apache-2.0; this list defines acceptable detected licenses for snippets and
# declared headers under first-party paths in this monorepo.

approved_spdx_license_identifiers:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - Python-2.0

# Match paths from ScanCode JSON (`path` uses forward slashes; may include a repo prefix).
# Patterns use pathlib PurePosixPath.match semantics (e.g. `cmd/**/*` matches `cmd/podbay/main.go`).
first_party_path_globs:
  - "cmd/**/*"
  - "internal/**/*"
  - "examples/**/*"
  - "README.md"
  - "LICENSE"
  - "go.mod"
  - "go.sum"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "RELEASES.md"
  - "tools/licensing/**"

# ScanCode synthetic refs (noise on ambiguous headers). Allowed only under first_party_path_globs.
allowed_license_ref_prefixes:
  - "LicenseRef-scancode-"

options:
  allow_unknown_license_ref_tokens_on_first_party_paths: true
  # Fail if a LicenseRef-scancode-* token appears under paths that are not first-party (e.g. vendored trees).
  allow_license_ref_tokens_outside_first_party: false
